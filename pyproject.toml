[project]
name = "aivfx-mcp"
version = "0.1.0"
description = "MCP server giving any AI agent searchable access to the AI VFX news feed and the code/models behind it"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["mcp>=1.2.0"]

[project.scripts]
aivfx-mcp = "aivfx_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aivfx_mcp"]
